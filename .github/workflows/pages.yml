name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages must exist before this workflow can publish. GITHUB_TOKEN cannot
      # create a site (configure-pages enablement fails with "Resource not
      # accessible by integration"). Enable once in repo Settings → Pages →
      # Source: GitHub Actions, then this job deploys on every main push.
      - uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p _site
          # Ship the desktop demo, not the whole git/history tree.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '_site' \
            --exclude '.cursor' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
