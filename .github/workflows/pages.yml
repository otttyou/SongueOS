name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push a static artifact to gh-pages. GITHUB_TOKEN can update branches but
# cannot create the Pages site resource; enable once under Settings → Pages →
# Deploy from a branch → gh-pages / (root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '_site' \
            --exclude '.cursor' \
            ./ _site/
          cp _site/SoengOS.html _site/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
